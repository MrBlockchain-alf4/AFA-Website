    :root {
      --navy:  #000E1F;
      --navy2: #001B3D;
      --gold:  #FFD84A;
      --gold2: #E6C235;
      --white: #FFFFFF;
      --muted: rgba(255,255,255,0.52);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Inter', -apple-system, Helvetica, sans-serif;
      background: #18192A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 48px;
      padding: 56px 32px;
    }

    .side-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.30);
      text-align: center;
      margin-bottom: 14px;
    }

    /* crop mark wrapper */
    .card-wrap {
      position: relative;
      display: inline-block;
    }

    .card-wrap::before,
    .card-wrap::after,
    .card-wrap .cm-bl,
    .card-wrap .cm-br {
      content: '';
      position: absolute;
      width: 8px; height: 8px;
      border-color: rgba(255,255,255,0.20);
      border-style: solid;
    }
    .card-wrap::before  { top:-6px;    left:-6px;  border-width:1px 0 0 1px; }
    .card-wrap::after   { top:-6px;    right:-6px; border-width:1px 1px 0 0; }
    .card-wrap .cm-bl   { bottom:-6px; left:-6px;  border-width:0 0 1px 1px; }
    .card-wrap .cm-br   { bottom:-6px; right:-6px; border-width:0 1px 1px 0; }

    /* ── CARD ──
       Print-ready bleed size: trim is 85x55mm, Vistaprint's upload canvas
       adds 1.5mm bleed per edge (88x58mm total, confirmed from their
       studio's own ruler labels). The card box below IS the bleed box —
       background/gold bar fill it edge-to-edge — while front-inner/
       back-inner keep the original padding plus 1.5mm, so all text stays
       exactly as far from the TRIM line as it did in the 85x55 version. No
       border-radius/box-shadow here: those were an on-screen mockup
       affordance and would otherwise bake mismatched corner pixels (the
       page background peeking through the rounded corners) into the flat
       print file. */
    .card {
      width: 88mm;
      height: 58mm;
      position: relative;
      overflow: hidden;
      display: block;
    }

    /* ─ FRONT ─ */
    .card-front {
      background: linear-gradient(135deg, #000812 0%, #001028 45%, #001B3D 100%);
    }
    .card-front::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 60% 70% at 85% 10%, rgba(255,216,74,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 40% 50% at 10% 90%, rgba(0,90,180,0.10) 0%, transparent 55%);
      pointer-events: none;
      z-index: 0;
    }
    /* gold left bar — extends into the bleed so a slight cut drift still
       shows gold, not white; after trimming at 1.5mm the visible sliver is
       exactly the original 3px. */
    .card-front::after {
      content: '';
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: calc(3px + 1.5mm);
      background: linear-gradient(180deg, #FFD84A 0%, #B8960C 100%);
      z-index: 2;
    }

    .front-inner {
      position: relative; z-index: 1;
      width: 100%; height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: calc(12px + 1.5mm) calc(16px + 1.5mm) calc(12px + 1.5mm) calc(20px + 1.5mm);
    }

    .front-logo img {
      height: 30px;
      filter: brightness(0) invert(1);
      opacity: 0.92;
      display: block;
    }

    .front-center {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 4px 0;
    }

    .front-name {
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .front-role {
      font-size: 7px;
      font-weight: 700;
      letter-spacing: 0.20em;
      text-transform: uppercase;
      color: var(--gold);
      margin-top: 5px;
    }

    .front-rule {
      width: 28px;
      height: 1.5px;
      background: var(--gold);
      margin-top: 7px;
      border-radius: 1px;
    }

    .front-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .front-co {
      font-size: 7px;
      font-weight: 600;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
    }

    .front-gem {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0.65;
    }

    /* ─ BACK ─ */
    .card-back {
      background: linear-gradient(140deg, #000810 0%, #000E1F 55%, #001228 100%);
    }
    .card-back::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 55% 65% at 15% 85%, rgba(255,216,74,0.06) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }
    /* gold right bar — same bleed logic as the front's left bar */
    .card-back::after {
      content: '';
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: calc(3px + 1.5mm);
      background: linear-gradient(180deg, #FFD84A 0%, #B8960C 100%);
      z-index: 2;
    }

    .back-inner {
      position: relative; z-index: 1;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: calc(12px + 1.5mm) calc(20px + 1.5mm) calc(12px + 1.5mm) calc(16px + 1.5mm);
      gap: 9px;
    }

    .back-kicker {
      font-size: 7px;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 2px;
    }

    .b-row {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .b-icon {
      width: 12px;
      flex-shrink: 0;
      color: var(--gold);
      opacity: 0.80;
      display: flex;
      align-items: center;
    }
    .b-icon svg { width: 10px; height: 10px; }

    .b-txt {
      font-size: 8.5px;
      font-weight: 500;
      color: rgba(255,255,255,0.78);
      line-height: 1.3;
    }

    .b-sep {
      height: 1px;
      background: rgba(255,255,255,0.06);
    }

    .b-tag {
      font-size: 7px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
    }

    /* ─ PRINT ─ */
    @media print {
      body { background: #fff; padding: 0; gap: 0; min-height: 0; }
      .side-label { display: none; }
      .card-wrap::before,
      .card-wrap::after,
      .card-wrap .cm-bl,
      .card-wrap .cm-br { border-color: #ccc; }
      .card { box-shadow: none; }
      @page { size: A4; margin: 20mm; }
    }
  </style>
</head>
